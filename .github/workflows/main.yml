name: Sync Google Sheets to JSON

on:
  schedule:
    - cron: '0 * * * *' # Запуск щогодини
  workflow_dispatch: # Кнопка для ручного запуску

jobs:
  update-json:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Sheet Data and Convert to JSON
        run: |
          python3 -c "
          import urllib.request, csv, json
          
          # 1. ВСТАВТЕ ВАШ ID ТАБЛИЦІ МІЖ ЛАПКАМИ НИЖЧЕ:
          spreadsheet_id = '1QfRy72cfeW0YTJPLPtWo7fsUg93GrYrBUf38KLc6TVE'
          
          url = f'https://docs.google.com/spreadsheets/d/{spreadsheet_id}/export?format=csv'


          
          try:
              # Завантажуємо дані через Python
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  csv_data = response.read().decode('utf-8')
              
              # Конвертуємо CSV в JSON
              reader = csv.DictReader(csv_data.splitlines())
              rows = list(reader)
              
              with open('data.json', mode='w', encoding='utf-8') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
                  
              print('Конвертація пройшла успішно!')
          except Exception as e:
              print('Помилка завантаження або обробки:', e)
              exit(1)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Дані не змінилися. Пропускаємо комміт."
          else
            git commit -m "Автоматичне оновлення даних з Google Sheets"
            git push
          fi

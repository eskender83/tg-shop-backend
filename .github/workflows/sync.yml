name: Sync Google Sheets to JSON

on:
  schedule:
    - cron: '0 * * * *' # Автоматичний запуск кожну годину
  workflow_dispatch: # Дозволяє запускати вручну кнопкою

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # Оновлено до v5, щоб прибрати попередження Node.js

      - name: Fetch Google Sheet Data and Convert to JSON
        run: |
          # ВСТАВТЕ ВАШ ID ТАБЛИЦІ МІЖ ЛАПКАМИ НИЖЧЕ:
          SPREADSHEET_ID="ВСТАВЬТЕ_СЮДА_ID_ТАБЛИЦЫ"
          
          # Завантажуємо CSV напрямую
          curl -L -o data.csv "https://google.com{SPREADSHEET_ID}/export?format=csv"
          
          # Конвертуємо через вбудований Python
          python3 -c "
          import csv, json
          try:
              with open('data.csv', mode='r', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  rows = list(reader)
              with open('data.json', mode='w', encoding='utf-8') as f:
                  json.dump(rows, f, indent=2, ensure_ascii=False)
              print('Конвертація пройшла успішно!')
          except Exception as e:
              print('Помилка обробки файлу:', e)
              exit(1)
          "
          rm -f data.csv

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Данные не изменились. Пропускаем коммит."
          else
            git commit -m "Автоматическое обновление данных из Google Sheets"
            git push
          fi

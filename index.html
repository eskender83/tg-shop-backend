<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Shop</title>
    <!-- Подключаем Telegram SDK -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --btn-color: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        h2 {
            margin-top: 0;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-card {
            border: 1px solid var(--hint-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-info font {
            font-size: 14px;
            color: var(--hint-color);
        }

        button {
            background-color: var(--btn-color);
            color: var(--btn-text);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--hint-color);
        }

        .checkout-btn {
            width: 100%;
            font-size: 16px;
            padding: 14px;
            background-color: #28a745;
            color: white;
        }
    </style>
</head>

<body>

    <h2>Каталог товаров</h2>
    <div class="product-list">
        <div class="product-card">
            <div class="product-info">
                <div><b>Беспроводные наушники</b></div>
                <font>3 500 руб.</font>
            </div>
            <button onclick="addToCart(1, 'Беспроводные наушники', 3500)">Купить</button>
        </div>
        <div class="product-card">
            <div class="product-info">
                <div><b>Умные часы</b></div>
                <font>7 900 руб.</font>
            </div>
            <button onclick="addToCart(2, 'Умные часы', 7900)">Купить</button>
        </div>
    </div>

    <div style="height: 80px;"></div> <!-- Отступ под кнопку -->

    <div class="footer">
        <button class="checkout-btn" id="cart-btn" onclick="checkout()">Оформить заказ (0 руб.)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Открываем приложение на весь экран

        let cart = [];
        let total = 0;

        function addToCart(id, title, price) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity++;
            } else {
                cart.push({ id, title, price, quantity: 1 });
            }
            calculateTotal();
        }

        function calculateTotal() {
            total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-btn').innerText = `Оформить заказ (${total} руб.)`;
        }

        async function checkout() {
            if (cart.length === 0) {
                tg.showAlert("Ваша корзина пуста!");
                return;
            }

            // Безопасно получаем данные пользователя из Telegram
            const user = tg.initDataUnsafe?.user;
            const orderData = {
                user_id: user?.id || 0,
                user_name: user?.first_name || "Аноним",
                items: cart,
                total_price: total
            };

            // НАСТРОЙКА: Сюда нужно будет вставить ссылку на ваш бэкенд на Render.com
            const BACKEND_URL = "https://tg-shop-backend-mnn9.onrender.com";

            tg.showProgress(); // Показываем анимацию загрузки

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                tg.hideProgress();

                if (response.ok) {
                    tg.showAlert("Заказ отправлен! Чек придет в диалог с ботом.");
                    cart = [];
                    calculateTotal();
                    tg.close(); // Закрываем магазин
                } else {
                    tg.showAlert("Произошла ошибка при обработке заказа сервером.");
                }
            } catch (error) {
                tg.hideProgress();
                tg.showAlert("Не удалось связаться с сервером магазина.");
            }
        }
    </script>
</body>

</html>

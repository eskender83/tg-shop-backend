<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Shop</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 15px;
        }

        .product {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: var(--tg-theme-button-color, #007bff);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .checkout-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-top: 20px;
            background: #28a745;
        }
    </style>
</head>

<body>

    <h2>Каталог товаров</h2>
    <div id="catalog">
        <div class="product">
            <div><strong>Кроссовки Nike</strong><br>5000 руб.</div>
            <button onclick="addToCart(1, 'Кроссовки Nike', 5000)">В корзину</button>
        </div>
        <div class="product">
            <div><strong>Футболка Adidas</strong><br>2000 руб.</div>
            <button onclick="addToCart(2, 'Футболка Adidas', 2000)">В корзину</button>
        </div>
    </div>

    <button class="checkout-btn" id="main-action-btn" onclick="sendOrder()">Оформить заказ (0 руб.)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];
        let totalPrice = 0;

        function addToCart(id, title, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id, title, price, quantity: 1 });
            }
            updateCartTotal();
        }

        function updateCartTotal() {
            totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('main-action-btn').innerText = `Оформить заказ (${totalPrice} руб.)`;
        }

        async function sendOrder() {
            if (cart.length === 0) return alert("Корзина пуста!");

            // Получаем ID пользователя из Telegram SDK
            const userId = tg.initDataUnsafe?.user?.id || 123456789; // 123456789 для теста в браузере

            const orderData = {
                user_id: userId,
                items: cart,
                total_price: totalPrice
            };

            try {
                // Отправляем POST запрос на наш Python FastAPI сервер
                const response = await fetch('https://ngrok-free.app', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    tg.showAlert("Заказ оформлен! Проверьте чат с ботом.");
                    tg.close();
                } else {
                    alert("Ошибка при создании заказа");
                }
            } catch (error) {
                console.error(error);
                alert("Не удалось связаться с сервером");
            }
        }
    </script>
</body>

</html>
